name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Commit do FDH2/UxPlay com o mDNS embutido (>= 1.74, ainda sem release). Trocar para atualizar.
  UXPLAY_REF: 28ed70a9876fe3f5864479f4e0d07abe4678383a

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Compilar UxPlay e montar bundle
        shell: msys2 {0}
        run: bash ci/montar-bundle.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compilar EspelhoIphone.exe
        run: go build -ldflags "-H windowsgui -s -w" -o dist/EspelhoIphone.exe .

      - name: Teste de fumaca
        run: ./ci/testar.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: EspelhoIphone
          path: dist/EspelhoIphone.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EspelhoIphone.exe
          generate_release_notes: true
